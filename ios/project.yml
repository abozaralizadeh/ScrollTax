name: ScrollTax
options:
  bundleIdPrefix: app.scrolltax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # put your Apple team ID here
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScrollTaxCore:
    path: Packages/ScrollTaxCore
targets:
  ScrollTax:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: ScrollTaxCore
      - target: ScrollTaxShield
      - target: ScrollTaxShieldAction
      - target: ScrollTaxMonitor
    entitlements:
      path: App/ScrollTax.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.app.scrolltax]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScrollTax
        UILaunchScreen: {}
        ScrollTaxAPIURL: $(SCROLLTAX_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scrolltax
        SCROLLTAX_API_URL: http://127.0.0.1:8787
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      storeKitConfiguration: ScrollTax.storekit
      testTargets: [ScrollTaxUITests]
  ScrollTaxShield:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig, Shared]
    dependencies:
      - package: ScrollTaxCore
    entitlements:
      path: ShieldConfig/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.scrolltax]
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ScrollTax Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScrollTaxShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scrolltax.shield
  ScrollTaxShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    dependencies:
      - package: ScrollTaxCore
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.scrolltax]
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ScrollTax Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScrollTaxShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scrolltax.shieldaction
  ScrollTaxMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    dependencies:
      - package: ScrollTaxCore
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.scrolltax]
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: ScrollTax Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScrollTaxMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scrolltax.monitor
  ScrollTaxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ScrollTax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scrolltax.uitests
        TEST_TARGET_NAME: ScrollTax
        GENERATE_INFOPLIST_FILE: YES
